<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tegs HTML</title>
</head>
<body>
    <h1>Tegs em HTML</h1>
    <P>Em HTML5, podemos inserir os elementos da lista a seguir. passe o mause sobre os termos para descobrir qual tag deverá ultilizar em cada caso</P>
    <ul>
        <li><abbr title="Use a teg &lt;p&gt;">Parágrafo</abbr></li>
        <li><abbr title="Use a teg &lt;img&gt;">Imagens</abbr></li>
        <li><abbr title="Use a teg &lt;H1&gt;">Titulos</abbr></li>
        <li><abbr title="Use a teg &lt;a&gt;">links</abbr></li>
        <li><abbr title="Use a teg &lt;ol&gt;">listas numeradas</abbr></li>
        <li><abbr title="Use a teg &lt;abbr&gt;">Abreviações</abbr></li>
        <li><abbr title="Use a teg &lt;ul&lt;">listas demarcadores</abbr></li>
        
    </ul>
</body>
</html>
