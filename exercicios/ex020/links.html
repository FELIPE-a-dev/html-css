<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando link</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: rgb(250, 3, 3);
            text-decoration: none;
            font-weight: bold;

        }

        a:visited {
            color: rgb(165, 0, 0);

        }

        a:hover {
            color: black;
            text-decoration: underline;
            
        }

        a:active{
            color: yellow;
        }

         /*a::after{
        
        }*/
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara" target="_blank">Repositório GuiHub</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" target="_blank">canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank">Site do cursoemvideo</a></li>
    </ul>
</body>
</html>
