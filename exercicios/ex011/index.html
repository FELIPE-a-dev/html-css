<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midiss em HTML</title>
</head>
<body>
    <h1>Imagen dinamica</h1>
    
    <p>Teste abrir esse site em vários dispositivos diferente ou simplesmente aumente e diminua o tamanho do seu navegador </p>

  <picture>
    <source media="(max-width: 749px)" srcset="imagens/foto-p.png" type="image/png">
    <source media="(max-width: 1049px)" srcset="imagens/foto-m.png" type="image/png">
    <img src="imagens/foto-g.png" alt="Imagem flexível">
  </picture>

   <h1>Reproduzindo audios em HTML5.
   </h1>
   <p>Vamos aprender a reproduzir audios em HTML5.</p>
   <audio preload="metadata" autoplay controls loop>
     <source src="midias/guanacast-33.mp3" type="audio/mpeg">
     <source src="midias/guanacast-33.mp3" type="audio/ogg">
     <source src="midias/guanacast-33.mp3" type="image/mav">
     <p>seu navegador não suporta audios <a href="midias/guanacast-33.mp3" download="guanacast-33.mp3" type="audio/mpeg"></a></p>
   </audio>
   

</body>
</html>
